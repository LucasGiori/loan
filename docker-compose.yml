version: '3.8'

services:
  quarkus-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      network: host
    container_name: loan-app
    volumes:
      - ./src:/opt/application/src
      - ./cache:/opt/application/cache:z
      - ./gradle:/opt/application/gradle
      - ./gradlew:/opt/application/gradlew
      - ./gradle.properties:/opt/application/gradle.properties
      - ./build.gradle.kts:/opt/application/build.gradle.kts
      - ./settings.gradle.kts:/opt/application/settings.gradle.kts
    ports:
      - "8080:8080"
      - "5005:5005"
    env_file:
      - ./environment/local.env
    networks:
      - loan_app

  mysql:
    image: mysql:8.4.8
    container_name: loan-mysql
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=86400
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: loan
      MYSQL_USER: loan
      MYSQL_PASSWORD: loan
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./create_table.sql:/docker-entrypoint-initdb.d/01-create_table.sql
      - ./debezium/debezium-user.sql:/docker-entrypoint-initdb.d/02-debezium-user.sql
    networks:
      - loan_app

  mysql-myadmin:
    image: phpmyadmin/phpmyadmin:latest
    links:
      - mysql
    ports:
      - 80:80
    environment:
      - PMA_ARBITRARY=1
    networks:
      - loan_app

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: loan-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - loan_app

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: loan-kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - loan_app

  kafka-connect:
    image: quay.io/debezium/connect:3.0
    container_name: loan-kafka-connect
    depends_on:
      - kafka
      - mysql
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: loan-connect-group
      CONFIG_STORAGE_TOPIC: loan.connect.configs
      OFFSET_STORAGE_TOPIC: loan.connect.offsets
      STATUS_STORAGE_TOPIC: loan.connect.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - loan_app

  init-connector:
    image: curlimages/curl:latest
    container_name: loan-init-connector
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./debezium:/debezium
    entrypoint: ["/bin/sh", "/debezium/init-connector.sh"]
    networks:
      - loan_app
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: loan-kafka-ui
    depends_on:
      - kafka
      - kafka-connect
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: loan-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: loan-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    networks:
      - loan_app

networks:
  loan_app:
    external: true
    name: loan_app